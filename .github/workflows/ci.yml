name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Ensure ripgrep (macOS)
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run check:subagents
      - run: npm run check:flow
      - run: npm run check:pack
      - run: npm run check:install
